# Vøling public beta on Fly.io.
# Run from the REPO ROOT (C:\Claude) so pipeline/ is in the build context:
#   fly deploy . -c fasade/web/fly.toml
app = "voling"
primary_region = "arn" # Stockholm

[build]
  dockerfile = "fasade/web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "voling_data"
  destination = "/app/fasade/web/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
