name: Deploy FINN+ prototype to GitHub Pages

on:
  push:
    branches: [main, claude/nifty-ritchie-imuaj3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finn-plus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finn-plus/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Claude
      - uses: actions/upload-pages-artifact@v3
        with:
          path: finn-plus/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
